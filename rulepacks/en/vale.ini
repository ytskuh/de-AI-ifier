StylesPath = ../../.vale-styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.16.0/ai-tells.zip, \
https://github.com/JMill/deslop/releases/download/v0.1.0/Deslop.zip

[formats]
tex = md

[*.{md,txt,tex}]
BasedOnStyles = ai-tells, Deslop, Deaiify

# LaTeX: '--' is an en-dash (Fokker--Planck, ranges), not AI em-dash overuse
[*.tex]
ai-tells.EmDashUsage = NO
