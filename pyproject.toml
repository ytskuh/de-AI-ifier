[project]
name = "deaiify"
version = "0.1.0"
description = "Editing assistant that localizes and fixes AI-writing tells in articles"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "pyyaml>=6",
    "pybiber>=0.3.1",
    "en-core-web-sm",
    "click>=8.4.1",
]

[dependency-groups]
stat = ["llama-cpp-python>=0.3.3"]

[tool.uv]
default-groups = ["stat"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
deaiify = "deaiify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deaiify"]
